name: Corefactor session check (read only)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests xlrd openpyxl
      - env:
          COREFACTOR_SESSIONID: ${{ secrets.COREFACTOR_SESSIONID }}
          COREFACTOR_BASE_URL: ${{ vars.COREFACTOR_BASE_URL || 'https://tw1.teleduce.corefactors.in' }}
        run: python tools/corefactor_session_check.py
