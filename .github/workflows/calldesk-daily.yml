name: Call Desk daily list

# Builds today's call lists for the Call Desk web app from the database only.
# The data is written by the source jobs themselves (16 Nov 2026): Corefactor call logs 06:53, Lead Box 07:03,
# Runo 07:13, appointments 07:23 (+ 01:01 PM), reminders 07:47 - each runs calldesk_load.py --only <step> --no-build.
# A step can still be re-run from here by hand (input "only").

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30)
    - cron: "25 2 * * *"    # 07:55 AM IST (was 08:05; changed 20 Nov 2026)
  workflow_dispatch:
    inputs:
      day:
        description: "List day YYYY-MM-DD (empty = today)"
        required: false
      rebuild:
        description: "Rebuild the day's list (rows nobody has touched yet)"
        type: boolean
        default: false
      appt_from:
        description: "Appointments step: load every day from this date (YYYY-MM-DD, history for incentives)"
        required: false
        default: ""
      days:
        description: "Days of call logs to (re)load"
        required: false
        default: "3"
      only:
        description: "Run only one step"
        type: choice
        options: [build, all, calls, reminders, appointments, leads]
        default: build

concurrency:
  group: calldesk-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests xlrd openpyxl "psycopg[binary]"
      - name: Load and build the lists
        env:
          VETBUDDY_USER: ${{ secrets.VETBUDDY_USER }}
          VETBUDDY_PASS: ${{ secrets.VETBUDDY_PASS }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_CALLLOG_ARCHIVE_FOLDER: ${{ vars.SP_CALLLOG_ARCHIVE_FOLDER || 'Call Log Archive' }}
          SP_LEADBOX_ARCHIVE_FOLDER: ${{ vars.SP_LEADBOX_ARCHIVE_FOLDER || 'Lead Box Archive' }}
          SP_RUNO_SITE_URL: ${{ vars.SP_RUNO_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_RUNO_LIBRARY: ${{ vars.SP_RUNO_LIBRARY || 'Documents' }}
          SP_RUNO_MASTER_PATH: ${{ vars.SP_RUNO_MASTER_PATH || 'Sanchu Reports/Runo CallLog.xlsx' }}
          IN_DAY: ${{ inputs.day }}
          IN_REBUILD: ${{ inputs.rebuild }}
          IN_DAYS: ${{ inputs.days }}
          IN_APPT_FROM: ${{ inputs.appt_from }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          args="--days ${IN_DAYS:-3}"
          if [ -n "$IN_DAY" ]; then args="$args --day $IN_DAY"; fi
          if [ "$IN_REBUILD" = "true" ]; then args="$args --rebuild"; fi
          if [ -n "$IN_APPT_FROM" ]; then args="$args --appt-from $IN_APPT_FROM"; fi
          if [ -z "$IN_ONLY" ]; then IN_ONLY=build; fi    # scheduled run: build only, from the database
          if [ "$IN_ONLY" != "all" ]; then args="$args --only $IN_ONLY"; fi
          python calldesk_load.py $args

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calldesk-${{ github.run_number }}
          path: login_debug.html
          if-no-files-found: ignore
          retention-days: 7
