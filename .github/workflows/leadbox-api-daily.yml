name: Corefactor daily Lead Box (API key)

# Every morning: fetch the leads created yesterday through Corefactor's Lead API (API key, no session id),
#   - append them to "Backend Leadbox Report.xlsx" (sanchureports OneDrive -> Sanchu Reports)
#     and drag the "Date" and "Appt Datevalue" formulas down for the new rows,
#   - save the day's file in <Sales Reports Sanchu>/Lead Box Archive (next to CRM Upload).
# A day already in the master (found by the "Date" column) is skipped; the archive copy is
# still saved. Uses the COREFACTOR_LEADBOX_API_KEY secret. Replaces leadbox-daily.yml (session id).

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
    - cron: "33 1 * * *"    # 07:03 AM IST -> leads created yesterday (after the call logs run)
  workflow_dispatch:
    inputs:
      date:
        description: "Day to add (created date), YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""
      if_present:
        description: "If that day is already in the master"
        type: choice
        options: [skip, replace]
        default: skip
      check:
        description: "Check only (compare with the master, change nothing)"
        type: boolean
        default: false

concurrency:
  group: corefactor-leadbox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests xlrd openpyxl

      # 19 Nov 2026: 1) fetch + day file in the archive, 2) the database (Call Desk has the leads within minutes),
      # 3) the master Excel - written in place through the Excel service (~10 min instead of ~45; no download).
      - name: Corefactor Lead Box - fetch + archive
        env:
          COREFACTOR_LEADBOX_API_KEY: ${{ secrets.COREFACTOR_LEADBOX_API_KEY }}
          COREFACTOR_BASE_URL: ${{ vars.COREFACTOR_BASE_URL || 'https://tw1.teleduce.corefactors.in' }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          # Archive copy: same site and library as CRM Upload
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_LEADBOX_ARCHIVE_FOLDER: ${{ vars.SP_LEADBOX_ARCHIVE_FOLDER || 'Lead Box Archive' }}
          # Master sheet
          SP_LEADBOX_SITE_URL: ${{ vars.SP_LEADBOX_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_LEADBOX_LIBRARY: ${{ vars.SP_LEADBOX_LIBRARY || 'Documents' }}
          SP_LEADBOX_MASTER_PATH: ${{ vars.SP_LEADBOX_MASTER_PATH || 'Sanchu Reports/Backend Leadbox Report.xlsx' }}
          SP_LEADBOX_IF_PRESENT: ${{ inputs.if_present || 'skip' }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_CHECK: ${{ inputs.check }}
        run: python corefactor_leadbox_api.py --stage archive --engine graph ${INPUT_DATE:+--date "$INPUT_DATE"} $( [ "$INPUT_CHECK" = "true" ] && echo --check )

      - name: Save the Lead Box to the database (Call Desk)
        if: inputs.check != true
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          OUTPUT_DIR: ${{ runner.temp }}/calldesk
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_LEADBOX_ARCHIVE_FOLDER: ${{ vars.SP_LEADBOX_ARCHIVE_FOLDER || 'Lead Box Archive' }}
        run: |
          pip install -q "psycopg[binary]" xlrd openpyxl requests
          python calldesk_load.py --only leads --no-build

      - name: Corefactor Lead Box - master Excel (in place)
        env:
          COREFACTOR_LEADBOX_API_KEY: ${{ secrets.COREFACTOR_LEADBOX_API_KEY }}
          COREFACTOR_BASE_URL: ${{ vars.COREFACTOR_BASE_URL || 'https://tw1.teleduce.corefactors.in' }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          # Archive copy: same site and library as CRM Upload
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_LEADBOX_ARCHIVE_FOLDER: ${{ vars.SP_LEADBOX_ARCHIVE_FOLDER || 'Lead Box Archive' }}
          # Master sheet
          SP_LEADBOX_SITE_URL: ${{ vars.SP_LEADBOX_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_LEADBOX_LIBRARY: ${{ vars.SP_LEADBOX_LIBRARY || 'Documents' }}
          SP_LEADBOX_MASTER_PATH: ${{ vars.SP_LEADBOX_MASTER_PATH || 'Sanchu Reports/Backend Leadbox Report.xlsx' }}
          SP_LEADBOX_IF_PRESENT: ${{ inputs.if_present || 'skip' }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_CHECK: ${{ inputs.check }}
        run: python corefactor_leadbox_api.py --stage excel --engine graph ${INPUT_DATE:+--date "$INPUT_DATE"} $( [ "$INPUT_CHECK" = "true" ] && echo --check )

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corefactor-leadbox-api-${{ github.run_number }}
          path: |
            corefactor_export.log
          if-no-files-found: ignore
          retention-days: 14
