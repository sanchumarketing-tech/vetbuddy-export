name: VoW one-day audit (read only)

on:
  workflow_dispatch:
    inputs:
      day:
        required: true
      clinic:
        default: "Coimbatore"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests "psycopg[binary]"
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOFRUGAL_USER: ${{ secrets.GOFRUGAL_USER }}
          GOFRUGAL_PASS: ${{ secrets.GOFRUGAL_PASS }}
          GOFRUGAL_URL: ${{ vars.GOFRUGAL_URL }}
          DAY: ${{ inputs.day }}
          CLINIC: ${{ inputs.clinic }}
        run: python tools/vow_day_audit.py
