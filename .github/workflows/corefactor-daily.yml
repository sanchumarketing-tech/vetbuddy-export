name: Corefactor daily call logs

# Every morning: export yesterday's call logs (All Calls) from Corefactor,
#   - append them to "Backend Call Log Report.xlsx" (sanchureports OneDrive -> Sanchu Reports)
#     and drag the "Date" formula down for the new rows,
#   - save the day's file in <Sales Reports Sanchu>/Call Log Archive (next to CRM Upload).
# A day already in the master (found by the "Date" column) is skipped; the archive copy is
# still saved. See README.md -> "Call logs (Corefactor)".

on:
  # 25 Nov 2026: switched off - the Backend Call Log master is written from the webhook (corefactor-db-daily.yml). Run by hand if ever needed.
  # schedule:
  #   # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
  #   - cron: "23 1 * * *"    # 06:53 AM IST -> yesterday's call logs
  workflow_dispatch:
    inputs:
      date:
        description: "Day to add, YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""
      if_present:
        description: "If that day is already in the master"
        type: choice
        options: [skip, replace]
        default: skip

concurrency:
  group: corefactor-calllogs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests xlrd openpyxl

      - name: Corefactor call logs
        env:
          COREFACTOR_SESSIONID: ${{ secrets.COREFACTOR_SESSIONID }}
          COREFACTOR_BASE_URL: ${{ vars.COREFACTOR_BASE_URL || 'https://tw1.teleduce.corefactors.in' }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          # Archive copy: same site and library as CRM Upload
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_CALLLOG_ARCHIVE_FOLDER: ${{ vars.SP_CALLLOG_ARCHIVE_FOLDER || 'Call Log Archive' }}
          # Master sheet
          SP_CALLLOG_SITE_URL: ${{ vars.SP_CALLLOG_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_CALLLOG_LIBRARY: ${{ vars.SP_CALLLOG_LIBRARY || 'Documents' }}
          SP_CALLLOG_MASTER_PATH: ${{ vars.SP_CALLLOG_MASTER_PATH || 'Sanchu Reports/Backend Call Log Report.xlsx' }}
          SP_CALLLOG_IF_PRESENT: ${{ inputs.if_present || 'skip' }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python corefactor_calllogs_export.py --date "$INPUT_DATE"
          else
            python corefactor_calllogs_export.py
          fi

      # Day's file + log on GitHub for 14 days (also on failure, for diagnosis)
      # Call Desk: write this job's data into the database too (16 Nov 2026). It cannot fail the job.
      - name: Save the call logs to the database (Call Desk)
        if: success()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          OUTPUT_DIR: ${{ runner.temp }}/calldesk
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_CALLLOG_ARCHIVE_FOLDER: ${{ vars.SP_CALLLOG_ARCHIVE_FOLDER || 'Call Log Archive' }}
        run: |
          pip install -q "psycopg[binary]" xlrd openpyxl requests
          python calldesk_load.py --only calls --source corefactor --days 3 --no-build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corefactor-calllogs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reports/*
            corefactor_export.log
            corefactor_debug.html
          if-no-files-found: ignore
          retention-days: 14
