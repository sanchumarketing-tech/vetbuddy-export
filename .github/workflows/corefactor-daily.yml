name: Corefactor daily call logs

# Every morning: export yesterday's call logs from Corefactor, append them to
# "Sanchu Reports/Backend Call Log Report.xlsx" (sanchureports OneDrive), and drag the
# "Date" formula down for the new rows. A day that is already in the sheet is skipped.
#
# Put this file in .github/workflows/ and corefactor_calllogs_export.py in the repo root
# (next to vetbuddy_sales_export.py).
#
# Secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   COREFACTOR_SESSIONID   the "sessionid" cookie from a browser signed in to Corefactor
#   SP_TENANT_ID, SP_CLIENT_ID, SP_CLIENT_SECRET   already there for the VetBuddy job
#
# When Corefactor logs that session out, the run fails with "Corefactor session has expired".
# Sign in to Corefactor in a browser, copy the new sessionid cookie into the secret, and use
# "Run workflow" to catch up the missed day.

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
    - cron: "23 1 * * *"    # 06:53 AM IST -> yesterday's call logs
  workflow_dispatch:
    inputs:
      date:
        description: "Day to add, YYYY-MM-DD (leave empty for yesterday)"
        required: false
        default: ""
      force:
        description: "Add even if that day is already in the master sheet"
        type: boolean
        default: false

concurrency:
  group: corefactor-calllogs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests xlrd openpyxl

      - name: Export call logs and update the master sheet
        env:
          COREFACTOR_SESSIONID: ${{ secrets.COREFACTOR_SESSIONID }}
          COREFACTOR_BASE_URL: https://tw1.teleduce.corefactors.in
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SITE_URL: https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in
          SP_LIBRARY: Documents
          SP_CALLLOG_MASTER_PATH: Sanchu Reports/Backend Call Log Report.xlsx
          SP_CALLLOG_DATE_COLUMN: Call Date
          SP_CALLLOG_FORMULA_COLUMNS: Date
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=""
          if [ -n "$INPUT_DATE" ]; then args="$args --date $INPUT_DATE"; fi
          if [ "$INPUT_FORCE" = "true" ]; then args="$args --force"; fi
          python corefactor_calllogs_export.py $args

      # Raw export + log kept on GitHub for 14 days (also on failure, for diagnosis)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corefactor-calllogs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reports/*
            corefactor_export.log
            corefactor_debug.html
          if-no-files-found: ignore
          retention-days: 14
