name: Look at a SharePoint workbook (read only)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "File name (start of it)"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests xlrd openpyxl
      - env:
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          IN_NAME: ${{ inputs.name }}
        run: python tools/sp_workbook_peek.py "$IN_NAME"
