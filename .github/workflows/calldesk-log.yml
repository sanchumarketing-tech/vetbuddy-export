name: Call Desk log to Excel

# 3 times a day (20-11-2026, was hourly - saves GitHub minutes and database reads): writes "Sanchu Reports/Call Desk Log.xlsx" (sanchureports OneDrive) from the
# Call Desk database - who was called, not called or rescheduled (with the new date and time). Read only.

on:
  schedule:
    - cron: "37 7 * * *"     # 01:07 PM IST
    - cron: "37 12 * * *"    # 06:07 PM IST
    - cron: "47 16 * * *"    # 10:17 PM IST (end of day)
  workflow_dispatch:

concurrency:
  group: calldesk-log
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests xlrd openpyxl "psycopg[binary]"
      - name: Write the Excel log
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_REMINDER_SITE_URL: ${{ vars.SP_REMINDER_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_REMINDER_LIBRARY: ${{ vars.SP_REMINDER_LIBRARY || 'Documents' }}
        run: python calldesk_log_export.py
      - name: DND and Deceased sheets (Call Desk marks -> the team's sheets)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          DND_IMPORT: ${{ vars.DND_IMPORT }}
        run: python calldesk_sheet_sync.py
