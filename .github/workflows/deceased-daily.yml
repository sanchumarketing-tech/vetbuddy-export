name: VetBuddy deceased pets (month to date)

# 23 Nov 2026: VetBuddy Compliance -> Patient Search by Visit Date Range -> Deceased -> all clinics -> mail merge XLS.
# Pets whose "Last Active" date is in the month (1st -> yesterday; on the 1st the whole previous month) replace the
# month's rows in "Deceased Pets Data.xlsx" (sanchureports OneDrive, sheet "Deceased Data"), matched by header name.
# All deceased pets also go to calldesk.deceased_pets, so the Call Desk never calls about them.

on:
  schedule:
    - cron: "1 2 * * *"      # 07:31 AM IST
  workflow_dispatch:
    inputs:
      mode:
        description: "empty = update, check = only report the workbook layout and counts"
        required: false
      month:
        description: "YYYY-MM to rewrite one whole month (optional)"
        required: false

concurrency:
  group: deceased-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests xlrd openpyxl "psycopg[binary]"
      - env:
          VETBUDDY_USER: ${{ secrets.VETBUDDY_USER }}
          VETBUDDY_PASS: ${{ secrets.VETBUDDY_PASS }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OUTPUT_DIR: ${{ runner.temp }}/out
          IN_MODE: ${{ inputs.mode }}
          IN_MONTH: ${{ inputs.month }}
        run: |
          args=""
          if [ "$IN_MODE" = "check" ]; then args="--check"; fi
          if [ -n "$IN_MONTH" ]; then args="$args --month $IN_MONTH"; fi
          python vetbuddy_deceased_export.py $args
      - name: DND and Deceased sheets (Call Desk marks -> the team's sheets)
        if: always() && inputs.mode != 'check'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          DND_IMPORT: ${{ vars.DND_IMPORT || '1' }}   # every number in the team's DND sheet is blocked (decided 23 Nov 2026)
        run: python calldesk_sheet_sync.py
