name: Runo daily MTD call logs

# Every morning: all Runo calls from the 1st of the month to yesterday (on the 1st: the whole
# previous month), through Runo's API:
#   - Runo_CallLogs_MTD_<from>_to_<to>.xlsx -> <Sales Reports Sanchu>/Runo Upload
#   - master "Runo CallLog.xlsx" (sanchureports OneDrive -> Sanchu Reports): this month's rows
#     replaced, "Date" and "Month" formulas dragged down. Older months are never touched.

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
    - cron: "43 1 * * *"    # 07:13 AM IST
  workflow_dispatch:
    inputs:
      from:
        description: "First day, YYYY-MM-DD (empty = 1st of this month)"
        required: false
        default: ""
      to:
        description: "Last day, YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""
      if_present:
        description: "If the master already has the last day (yesterday)"
        type: choice
        options: [skip, replace]
        default: skip
      file_only:
        description: "Only make and upload the file (don't touch the master)"
        type: boolean
        default: false

concurrency:
  group: runo-calllogs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl

      - name: Runo call logs
        env:
          RUNO_API_KEY: ${{ secrets.RUNO_API_KEY }}
          RUNO_PROCESS: ${{ vars.RUNO_PROCESS }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          # Runo Upload: same site and library as CRM Upload
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_RUNO_UPLOAD_FOLDER: ${{ vars.SP_RUNO_UPLOAD_FOLDER || 'Runo Upload' }}
          # Master sheet
          SP_RUNO_SITE_URL: ${{ vars.SP_RUNO_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_RUNO_LIBRARY: ${{ vars.SP_RUNO_LIBRARY || 'Documents' }}
          SP_RUNO_MASTER_PATH: ${{ vars.SP_RUNO_MASTER_PATH || 'Sanchu Reports/Runo CallLog.xlsx' }}
          SP_RUNO_IF_PRESENT: ${{ inputs.if_present || 'skip' }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_FILE_ONLY: ${{ inputs.file_only }}
        run: |
          args=""
          if [ -n "$IN_FROM" ]; then args="$args --from $IN_FROM"; fi
          if [ -n "$IN_TO" ]; then args="$args --to $IN_TO"; fi
          if [ "$IN_FILE_ONLY" = "true" ]; then args="$args --file-only"; fi
          python runo_calllogs_export.py $args

      # File + log on GitHub for 14 days (also on failure, for diagnosis)
      # Call Desk: write this job's data into the database too (16 Nov 2026). It cannot fail the job.
      - name: Save the Runo calls to the database (Call Desk)
        if: success()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          OUTPUT_DIR: ${{ runner.temp }}/calldesk
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_RUNO_SITE_URL: ${{ vars.SP_RUNO_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_RUNO_LIBRARY: ${{ vars.SP_RUNO_LIBRARY || 'Documents' }}
          SP_RUNO_MASTER_PATH: ${{ vars.SP_RUNO_MASTER_PATH || 'Sanchu Reports/Runo CallLog.xlsx' }}
        run: |
          pip install -q "psycopg[binary]" xlrd openpyxl requests
          python calldesk_load.py --only calls --source runo --days 3 --no-build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runo-calllogs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reports/*.xlsx
            corefactor_export.log
          if-no-files-found: ignore
          retention-days: 14
