name: VetBuddy daily Appointment Status

# Every morning: VetBuddy -> Settings -> Business Intelligence -> Appointment Status for
# YESTERDAY, all clinics -> Create XLS, then
#   - the day's file (title rows removed) -> <Sales Reports Sanchu>/Appointment Status Archive
#   - rows appended under the last row of "Appointment Status.xlsx" (sanchureports OneDrive ->
#     Sanchu Reports), sheet "Sheet1", with the "Created Date" (T) and "Date" (U) formulas.
# Every day at 1 PM: the same report for TODAY, as it stands at 1 PM, appended under the last
# row of the sheet "Next day" (with the "Appt date" formula in T).
# A day already in the sheet is skipped. See README.md -> "VetBuddy Appointment Status".

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
    - cron: "53 1 * * *"    # 07:23 AM IST -> yesterday's appointments -> Sheet1
    - cron: "31 7 * * *"    # 01:01 PM IST -> today's appointments so far -> Next day
  workflow_dispatch:
    inputs:
      run:
        description: "Which run"
        type: choice
        options: ["yesterday -> Sheet1", "today (now) -> Next day"]
        default: "yesterday -> Sheet1"
      date:
        description: "Sheet1 only: one day to add, YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""
      from:
        description: "Sheet1 only: or a range to catch up - first day, YYYY-MM-DD"
        required: false
        default: ""
      to:
        description: "Last day of the range, YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""
      if_present:
        description: "If the day is already in the master"
        type: choice
        options: [skip, replace]
        default: skip
      file_only:
        description: "Only make and archive the file (don't touch the master)"
        type: boolean
        default: false

concurrency:
  group: vetbuddy-appointments
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests xlrd openpyxl

      - name: Appointment Status
        env:
          VETBUDDY_USER: ${{ secrets.VETBUDDY_USER }}
          VETBUDDY_PASS: ${{ secrets.VETBUDDY_PASS }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          # Archive copy: same site and library as CRM Upload
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_APPT_ARCHIVE_FOLDER: ${{ vars.SP_APPT_ARCHIVE_FOLDER || 'Appointment Status Archive' }}
          # Master sheet
          SP_APPT_SITE_URL: ${{ vars.SP_APPT_SITE_URL || 'https://sanchuhospital-my.sharepoint.com/personal/sanchureports_sanchu_co_in' }}
          SP_APPT_LIBRARY: ${{ vars.SP_APPT_LIBRARY || 'Documents' }}
          SP_APPT_MASTER_PATH: ${{ vars.SP_APPT_MASTER_PATH || 'Sanchu Reports/Appointment Status.xlsx' }}
          SP_APPT_SHEET: ${{ vars.SP_APPT_SHEET || 'Sheet1' }}
          SP_APPT_TODAY_SHEET: ${{ vars.SP_APPT_TODAY_SHEET || 'Next day' }}
          # "today" for the 1 PM schedule or when chosen; otherwise the morning run
          IN_TODAY: ${{ (github.event.schedule == '31 7 * * *' || startsWith(inputs.run, 'today')) && 'true' || 'false' }}
          SP_APPT_IF_PRESENT: ${{ inputs.if_present || 'skip' }}
          IN_DATE: ${{ inputs.date }}
          IN_FROM: ${{ inputs.from }}
          IN_TO: ${{ inputs.to }}
          IN_FILE_ONLY: ${{ inputs.file_only }}
        run: |
          args=""
          if [ "$IN_TODAY" = "true" ]; then
            args="--today"
            if [ "$IN_FILE_ONLY" = "true" ]; then args="$args --file-only"; fi
            python vetbuddy_appointments_export.py $args
            exit $?
          fi
          if [ -n "$IN_DATE" ]; then args="$args --date $IN_DATE"; fi
          if [ -n "$IN_FROM" ]; then args="$args --from $IN_FROM"; fi
          if [ -n "$IN_TO" ]; then args="$args --to $IN_TO"; fi
          if [ "$IN_FILE_ONLY" = "true" ]; then args="$args --file-only"; fi
          python vetbuddy_appointments_export.py $args

      # Day's file + log on GitHub for 14 days (also on failure, for diagnosis)
      # Call Desk: write this job's data into the database too (16 Nov 2026). It cannot fail the job.
      - name: Save the appointments to the database (Call Desk)
        if: success()
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          OUTPUT_DIR: ${{ runner.temp }}/calldesk
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          VETBUDDY_USER: ${{ secrets.VETBUDDY_USER }}
          VETBUDDY_PASS: ${{ secrets.VETBUDDY_PASS }}
        run: |
          pip install -q "psycopg[binary]" xlrd openpyxl requests
          python calldesk_load.py --only appointments --no-build

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetbuddy-appointments-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reports/VetBuddy_AppointmentStatus_*.xlsx
            vetbuddy_export.log
            login_debug.html
          if-no-files-found: ignore
          retention-days: 14
