name: Corefactor today -> Call Desk database (gap fill)

# Run by hand: loads today's Corefactor call-log export into calldesk.calls only (no SharePoint).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests xlrd openpyxl "psycopg[binary]"
      - name: Load today's export
        env:
          COREFACTOR_SESSIONID: ${{ secrets.COREFACTOR_SESSIONID }}
          COREFACTOR_BASE_URL: ${{ vars.COREFACTOR_BASE_URL || 'https://tw1.teleduce.corefactors.in' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python tools/corefactor_today_db.py
