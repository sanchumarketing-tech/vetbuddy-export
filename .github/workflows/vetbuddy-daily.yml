name: VetBuddy daily MTD export

on:
  schedule:
    # Times are UTC (IST = UTC + 5:30). GitHub may start a few minutes late.
    - cron: "17 1 * * *"    # 06:47 AM IST  -> export, upload to SharePoint, refresh master sheet, send to the MIS Upload Hub
    - cron: "17 18 * * *"   # 11:47 PM IST  -> move the day's file to the archive folder
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [export, archive, backfill, backfill_pharmacy, reload_month]
        default: export
      month:
        description: "Only for reload_month: the month to reload, YYYY-MM (e.g. 2026-10)"
        type: string
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # "archive" for the 11:47 PM schedule; manual runs use the chosen task; otherwise "export"
      TASK: ${{ github.event.schedule == '17 18 * * *' && 'archive' || inputs.task || 'export' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests xlrd openpyxl "psycopg[binary]" pandas lxml

      - name: Run ${{ env.TASK }}
        env:
          VETBUDDY_USER: ${{ secrets.VETBUDDY_USER }}
          VETBUDDY_PASS: ${{ secrets.VETBUDDY_PASS }}
          OUTPUT_DIR: ${{ runner.temp }}/reports
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_SITE_URL: ${{ vars.SP_SITE_URL }}
          SP_LIBRARY: ${{ vars.SP_LIBRARY || 'Documents' }}
          SP_FOLDER: ${{ vars.SP_FOLDER || 'VetBuddy Reports' }}
          SP_ARCHIVE_FOLDER: ${{ vars.SP_ARCHIVE_FOLDER }}
          SP_MASTER_PATH: ${{ vars.SP_MASTER_PATH }}
          SP_MASTER_SITE_URL: ${{ vars.SP_MASTER_SITE_URL }}
          SP_MASTER_LIBRARY: ${{ vars.SP_MASTER_LIBRARY }}
          SP_GOFRUGAL_FOLDER: ${{ vars.SP_GOFRUGAL_FOLDER }}
          SP_GOFRUGAL_ARCHIVE_FOLDER: ${{ vars.SP_GOFRUGAL_ARCHIVE_FOLDER }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOFRUGAL_USER: ${{ secrets.GOFRUGAL_USER }}
          GOFRUGAL_PASS: ${{ secrets.GOFRUGAL_PASS }}
          GOFRUGAL_URL: ${{ vars.GOFRUGAL_URL }}
          # Gofrugal data-sync checkpoint (gofrugal_sync.py) - ON only when GOFRUGAL_SYNC_USER is set
          GOFRUGAL_SYNC_USER: ${{ secrets.GOFRUGAL_SYNC_USER }}
          GOFRUGAL_SYNC_PASS: ${{ secrets.GOFRUGAL_SYNC_PASS }}
          GOFRUGAL_HQ_PASS: ${{ secrets.GOFRUGAL_HQ_PASS }}
          RELOAD_MONTH: ${{ inputs.month }}
        run: |
          if [ "$TASK" = "archive" ]; then
            python vetbuddy_sales_export.py --archive
          elif [ "$TASK" = "backfill" ]; then
            python vetbuddy_sales_export.py --backfill
          elif [ "$TASK" = "backfill_pharmacy" ]; then
            python vetbuddy_sales_export.py --backfill-pharmacy
          elif [ "$TASK" = "reload_month" ]; then
            python vetbuddy_sales_export.py --reload-month
          else
            python vetbuddy_sales_export.py
          fi

      # NEW: send the VetBuddy export(s) to the MIS Upload Hub, which passes them on to every MIS
      # on its Report Types “Send to” list (SM Calling sheets, Google performance, …).
      # Runs after export / backfill / reload_month only. Files the hub doesn’t recognise are skipped by the hub.
      - name: Send to the MIS Upload Hub
        if: success() && (env.TASK == 'export' || env.TASK == 'backfill' || env.TASK == 'reload_month')
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_KEY: ${{ secrets.HUB_KEY }}
          REPORTS: ${{ runner.temp }}/reports
        run: |
          shopt -s nullglob
          files=("$REPORTS"/*.xlsx "$REPORTS"/*.xls "$REPORTS"/*.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No export files found in $REPORTS - nothing to send."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "== $f"
            python send_to_hub.py "$f"
          done

      # Backup copy + log on GitHub for 14 days (also on failure, for diagnosis)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetbuddy-${{ env.TASK }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/reports/*.xlsx
            vetbuddy_export.log
            login_debug.html
          if-no-files-found: ignore
          retention-days: 14
