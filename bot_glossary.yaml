# =====================================================================
# VetBuddy Teams bot – business dictionary
# The bot reads this file to understand everyday words. Edit it freely.
# Data sources:
#   vetbuddy.v_all_sales     ALL sales = VetBuddy + Gofrugal pharmacy (matches the Daily Sales Report)
#                            columns: sale_date, source ('VetBuddy'/'Pharmacy'), bill_no, clinic, item_name,
#                            plan_category, plan_subcategory, species, qty, amount, is_vow, sales_unit, doctor
#   vetbuddy.v_sales_bot     VetBuddy detail (services, surgeries, vaccinations, species, discounts…)
#   vetbuddy.v_pharmacy_bot  Gofrugal pharmacy detail (items, manufacturer, returns)
# =====================================================================

# --- Amounts (same as the Daily Sales Report) ---------------------------
measures:
  sales:        "SUM(amount) FROM v_all_sales  -- VetBuddy Net Sales − Net Return + pharmacy before tax − returns (= Daily Sales Report)"
  revenue:      "SUM(amount)"
  net sales:    "SUM(amount)"
  sales incl. GST / billed amount: "SUM(final_sales)"
  gross sales:  "SUM(gross_sales)  -- before discount"
  discount:     "SUM(discount_amount)"
  gst / tax:    "SUM(tax_amount)"
  returns:      "SUM(return_net)"
  invoices / bills: "COUNT(DISTINCT invoice_no)"
  cases / procedures / services done: "COUNT(*) of matching lines (SUM(qty) for quantity)"

# --- Units: clinics and Vet on Wheels ------------------------------------
# Every line has sales_unit = the unit the sale belongs to:
#   clinic units: ADYAR, ANNA NAGAR, VELACHERY, NEELANGARAI, VALASARAVAKKAM,
#                 COIMBATORE, MADURAI, TRICHY
#   VOW units:    CH VET ON WHEELS (all Chennai clinics), CBE VET ON WHEELS,
#                 MADURAI VET ON WHEELS, TRICHY VET ON WHEELS
units_rules: >
  "Adyar sales", "Madurai clinic" etc. = sales_unit = 'ADYAR' / 'MADURAI'
  (this EXCLUDES their Vet on Wheels invoices – say so in the answer).
  "Vet on Wheels", "VOW", "home visits", "mobile vet" = is_vow = true;
  per VOW unit: GROUP BY sales_unit WHERE is_vow.
  "Chennai VOW" = 'CH VET ON WHEELS'; "Coimbatore/CBE VOW" = 'CBE VET ON WHEELS';
  "Madurai VOW" = 'MADURAI VET ON WHEELS'; "Trichy VOW" = 'TRICHY VET ON WHEELS'.
  "Everything billed at Madurai" (clinic + VOW) = clinic = 'Madurai' (billed clinic).
  "Total network sales" = all rows (clinic + VOW together; VOW is not extra).
  'UNMAPPED' / 'VOW - UNMAPPED CLINIC' = billed clinic not in the mapping: report as is.
vow_rule: >
  An invoice is Vet on Wheels when ANY of its lines' item contains "VOW", or starts
  with "Home visit", "Nobivac" or "Mobile Veterinary Consult", or is exactly
  "Consultation VOW". Then EVERY line of that invoice is VOW (also tablets etc.).
  The rule lives in vow.py; the master sheet shows it in column AY "VOW Unit".
pharmacy: >
  Pharmacy = Gofrugal (source = 'Pharmacy' in v_all_sales; detail in v_pharmacy_bot).
  "Sales", "revenue", "total" = v_all_sales (VetBuddy + pharmacy). "Clinic/services sales"
  or "without pharmacy" = source = 'VetBuddy'. "Pharmacy sales" = source = 'Pharmacy'.
  Pharmacy VOW: a pharmacy bill is VOW when the same doctor did a VOW invoice in VetBuddy
  that day at that clinic (already in is_vow / sales_unit).
  Pharmacy bills can reach Gofrugal a day late; each morning the whole month is reloaded.

# --- Service groups: word the staff use -> filter -------------------------
groups:
  surgery / surgeries / operation: "plan_subcategory = 'Surgery'"
  spay / neuter / castration: "plan_subcategory = 'Surgery' AND (item_name ILIKE '%spay%' OR item_name ILIKE '%neuter%' OR item_name ILIKE '%castrat%')"
  procedure:      "plan_subcategory = 'Procedure'"
  consultation:   "plan_subcategory IN ('Consultation','OPD')"
  vaccination / vaccine: "plan_category ILIKE 'Vaccination%'"
  lab / laboratory / blood test: "plan_category ILIKE 'Laboratory%'"
  diagnostics / scan / x-ray / ultrasound: "plan_category ILIKE 'Diagnostics%'"
  grooming / spa / saloon / salon: "plan_category ILIKE 'Spa and Saloon%'"
  bath / bathing: "plan_subcategory = 'Bathing'"
  haircut:        "plan_subcategory = 'Haircut'"
  boarding:       "plan_category ILIKE 'BOARDING%'"
  pet taxi / transport: "plan_subcategory ILIKE 'transport' OR sales_type = 'Pet Taxi'"
  medicine / medication: "plan_subcategory = 'Medication'"
  certificate:    "plan_subcategory = 'Certificate'"

# --- Animals ---------------------------------------------------------------
species:
  dog / canine: "species = 'Canine'"
  cat / feline: "species = 'Feline'"
  bird:         "species IN ('Avian','bird')"

# --- Dates (India time) ----------------------------------------------------
dates: >
  "yesterday" = today - 1; "this month" = 1st of this month to yesterday;
  "last month" = the full previous calendar month; "last week" = previous Mon–Sun.
  Data is loaded each morning (~6:47 AM) up to yesterday, so "today" has no data
  yet – say so instead of answering 0. Show "data as of" from v_data_freshness.
